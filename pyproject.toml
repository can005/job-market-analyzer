[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-analyzer"
version = "0.1.0"


[tool.setuptools.packages.find]
include = ["ingestion*","agents*","core*","ui*", "tests*"]

[tool.pytest.ini_options]
markers = [
    "integration: requires pgvector :5433 (read-only DB)",
    "e2e: requires OPENAI_API_KEY; hits the LLM, slow, manual",
]
addopts = "-m 'not integration and not e2e'"