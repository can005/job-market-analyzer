name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-base.txt -r requirements-dev.txt
      - run: pip install -e . --no-deps
      - run: pytest --cov --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jma
          POSTGRES_PASSWORD: jma
          POSTGRES_DB: jma
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-base.txt -r requirements-dev.txt -r requirements-ingestion.txt
      - run: pip install -e . --no-deps
      - run: pytest -m integration
        env:
          DB_HOST: localhost
          DB_PORT: '5433'
          DB_USER: jma
          DB_PASSWORD: jma
          DB_NAME: jma
          RO_DB_USER: jma
          RO_DB_PASSWORD: jma

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jma
          POSTGRES_PASSWORD: jma
          POSTGRES_DB: jma
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-base.txt -r requirements-dev.txt -r requirements-ingestion.txt
      - run: pip install -e . --no-deps
      - run: pytest -m e2e
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGSMITH_TRACING: 'false'
          LANGSMITH_API_KEY: placeholder
          LANGSMITH_PROJECT: placeholder
          DB_HOST: localhost
          DB_PORT: '5433'
          DB_USER: jma
          DB_PASSWORD: jma
          DB_NAME: jma
          RO_DB_USER: jma
          RO_DB_PASSWORD: jma
